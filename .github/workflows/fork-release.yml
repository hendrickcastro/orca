name: Fork Release (Orca knwr)

# Builds Windows and macOS installers for every push to main of this fork and publishes them
# as one GitHub release, which is the feed the installed app's updater reads.
# Kept in its own file so upstream syncs never conflict with it.

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # Why serialized: each run takes the next version number from the tags of the previous one.
  group: fork-release
  cancel-in-progress: false

jobs:
  prepare:
    if: github.repository == 'hendrickcastro/orca'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      # Why full history: the release notes list every commit since the previous release.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Compute the fork version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          base="$(node -p "require('./package.json').version")"
          IFS=. read -r major minor patch <<<"${base%%-*}"
          # Why patch*100+n: every fork build must sort above the last one and above the upstream
          # version it is built from, and Windows caps each version part at 65535.
          floor=$((patch * 100))
          last="$(git ls-remote --tags "https://github.com/${GITHUB_REPOSITORY}.git" "refs/tags/v${major}.${minor}.*" \
            | sed -E 's#.*refs/tags/v##; s#\^\{\}$##' \
            | awk -F. -v M="$major" -v m="$minor" -v lo="$floor" \
                '$1 == M && $2 == m && $3 >= lo && $3 < lo + 100 { print $3 - lo }' \
            | sort -n | tail -1)"
          next=$(( ${last:-0} + 1 ))
          if (( next > 99 )); then
            echo "::error::99 fork releases already exist for upstream ${base}; merge a newer upstream version first."
            exit 1
          fi
          version="${major}.${minor}.$(( floor + next ))"
          echo "version=${version}" >>"$GITHUB_OUTPUT"
          echo "tag=v${version}" >>"$GITHUB_OUTPUT"
          echo "Fork version ${version} (upstream ${base}, build ${next})"

      - name: Create the draft release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          # Why: a failed run leaves its draft behind without a tag, so this run reuses the number.
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft' 2>/dev/null | grep -qx true; then
            gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes
          fi
          # Why the marker: only releases with generated notes bound the next changelog, so the
          # first one lists everything the fork added and later ones only what is new.
          previous="$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=50" \
            --jq '[.[] | select(.draft == false and (.body // "" | contains("<!-- fork-release-notes -->")))][0].tag_name // ""')"
          git fetch -q https://github.com/stablyai/orca.git main
          {
            echo '<!-- fork-release-notes -->'
            bash config/fork/release-notes.sh "$previous" "$GITHUB_SHA" FETCH_HEAD "$GITHUB_REPOSITORY"
          } >"$RUNNER_TEMP/notes.md"
          echo "Changelog base: ${previous:-everything the fork added}"
          # Why draft: the updater must never see a release until both platforms uploaded.
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --target "$GITHUB_SHA" \
            --title "Orca knwr $VERSION" \
            --notes-file "$RUNNER_TEMP/notes.md"

  build-windows:
    needs: prepare
    runs-on: windows-2022
    timeout-minutes: 120
    env:
      NODE_OPTIONS: --max-old-space-size=4096
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/setup@v2
        with:
          install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: package.json
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            mobile/pnpm-lock.yaml

      - name: Cache electron-builder downloads
        uses: actions/cache@v5
        with:
          path: |
            ~\AppData\Local\electron\Cache
            ~\AppData\Local\electron-builder\Cache
          key: electron-builder-win-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            electron-builder-win-

      - name: Install dependencies
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 15
          max_attempts: 3
          retry_wait_seconds: 30
          command: pnpm install --frozen-lockfile

      - uses: ./.github/actions/install-mobile-dependencies

      - name: Stamp the fork version
        shell: bash
        run: npm pkg set "version=${VERSION}"

      - name: Build app
        shell: bash
        run: pnpm build:release

      - name: Publish Windows installer
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ORCA_BUILD_COMMIT: ${{ github.sha }}
          EP_GH_IGNORE_TIME: 'true'
        run: |
          set -euo pipefail
          node config/scripts/ensure-native-runtime.mjs --runtime=electron
          pnpm exec electron-builder --config config/electron-builder.config.cjs --win \
            --publish always -c.publish.releaseType=draft

  build-macos:
    needs: prepare
    # Why macos-15: the Computer Use helper needs Swift 6 tools (Xcode 16).
    runs-on: macos-15
    timeout-minutes: 150
    env:
      NODE_OPTIONS: --max-old-space-size=4096
      VERSION: ${{ needs.prepare.outputs.version }}
      ORCA_COMPUTER_MACOS_BUNDLE_ID: com.knwr.orca.computer-use
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/setup@v2
        with:
          install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: package.json
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            mobile/pnpm-lock.yaml

      - name: Cache electron-builder downloads
        uses: actions/cache@v5
        with:
          path: |
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
          key: electron-builder-mac-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            electron-builder-mac-

      # Why both CPUs: the DMG and ZIP targets ship x64 and arm64 from one runner.
      - name: Install dependencies
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 15
          max_attempts: 3
          retry_wait_seconds: 30
          command: pnpm install --frozen-lockfile --cpu=current,x64,arm64

      - uses: ./.github/actions/install-mobile-dependencies

      - name: Stamp the fork version
        run: npm pkg set "version=${VERSION}"

      - name: Build app
        run: pnpm build:release

      # Why ad-hoc signing: the fork has no Apple Developer ID; arm64 still needs a signature to launch.
      - name: Publish macOS installers
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ORCA_BUILD_COMMIT: ${{ github.sha }}
          EP_GH_IGNORE_TIME: 'true'
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          set -euo pipefail
          node config/scripts/ensure-native-runtime.mjs --runtime=electron
          # Why DMG only: the ZIP and latest-mac.yml feed only Squirrel.Mac, which cannot install an
          # unsigned build; install-macos.sh uses the DMG, so the rest would just take space.
          pnpm exec electron-builder --config config/electron-builder.config.cjs --mac dmg --x64 --arm64 \
            --publish always -c.publish.releaseType=draft -c.mac.identity=- -c.dmg.writeUpdateInfo=false

  publish:
    needs: [prepare, build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      # Why: the Mac build is not notarized; this script installs it the way Gatekeeper accepts.
      - name: Attach the macOS install script
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: gh release upload "$TAG" config/fork/install-macos.sh --repo "$GITHUB_REPOSITORY" --clobber

      - name: Verify assets and publish the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          assets="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')"
          echo "Assets on $TAG:"
          echo "$assets"
          for required in latest.yml orca-knwr-windows-setup.exe \
            orca-knwr-macos-arm64.dmg orca-knwr-macos-x64.dmg install-macos.sh; do
            if ! grep -qx "$required" <<<"$assets"; then
              echo "::error::$TAG is missing $required; leaving the release as a draft."
              exit 1
            fi
          done
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
          echo "Published $TAG."
